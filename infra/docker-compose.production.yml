services:
  # ---------------------------------------------------------------------------
  # Postgres is NOT a service in this stack. It is a dedicated Coolify
  # "Database" (PostgreSQL) resource, created separately in the same Coolify
  # project as this compose resource (so they share a private network) —
  # that resource type is the only place Coolify exposes native scheduled
  # backups to an S3 target. Create it first, configure its Backups tab
  # (schedule + a bucket separate from the object-storage bucket below), then
  # copy its connection details into DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/
  # DB_DATABASE below. See README.md "Production on Coolify".
  # ---------------------------------------------------------------------------

  migrate:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-api:${IMAGE_TAG:-production-latest}'
    pull_policy: always
    # Migrations, the default account from DEFAULT_ACCOUNT_*, the hand-picked skills and the
    # weekly skills.sh search, then the sandbox prune and the E2B template repository
    # sandboxes start from, built the first time (all idempotent).
    command:
      - sh
      - '-c'
      - 'node ace migration:run --force && node ace account:ensure-default && node ace skills:setup && node ace watch:setup && node ace assistant:setup && node ace claude:import'
    restart: 'no'
    volumes:
      - claude-config:/data/claude
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_KEY: '${SERVICE_PASSWORD_64_APPKEY}'
      DEFAULT_ACCOUNT_EMAIL: '${DEFAULT_ACCOUNT_EMAIL}'
      DEFAULT_ACCOUNT_PASSWORD: '${DEFAULT_ACCOUNT_PASSWORD}'
      DEFAULT_ACCOUNT_NAME: '${DEFAULT_ACCOUNT_NAME:-}'
      SKILLS_REFRESH_ENABLED: '${SKILLS_REFRESH_ENABLED:-true}'
      SKILLS_GITHUB_TOKEN: '${SKILLS_GITHUB_TOKEN:-}'
      FRONTEND_URL: '${SERVICE_URL_WEB}'
      # Keys of the encrypter that seals every stored LLM secret (keys, subscriptions).
      LLM_KEYS_ENCRYPTION_KEYS: '${LLM_KEYS_ENCRYPTION_KEYS:-}'
      # `claude:import` moves the Claude account folders from before into the DB.
      CLAUDE_CODE_HOME: /data/claude
      # E2B sandboxes, required: code maps from GitHub, the assistant's repository tools and
      # the web research all run there. The key alone is E2B Cloud; a self-hosted install
      # (e2b-dev/runtime, Embed) adds its two URLs.
      E2B_API_KEY: '${E2B_API_KEY:?set E2B_API_KEY (E2B Cloud, or a self-hosted install with E2B_API_URL and E2B_SANDBOX_URL)}'
      E2B_API_URL: '${E2B_API_URL:-}'
      E2B_SANDBOX_URL: '${E2B_SANDBOX_URL:-}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_DATABASE: '${DB_DATABASE}'
      # true if the Database resource is NOT on this compose resource's
      # private network (e.g. reached over a public endpoint); false if it is.
      DB_SSL: '${DB_SSL:-false}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SMTP_HOST: '${SMTP_HOST}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'

  api:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-api:${IMAGE_TAG:-production-latest}'
    pull_policy: always
    restart: unless-stopped
    # Without `expose`, Coolify can't detect any port and falls back to 3000.
    expose:
      - '3333'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_NAME: coreloom-uml-api-production
      LOG_LEVEL: info
      APP_KEY: '${SERVICE_PASSWORD_64_APPKEY}'
      DEFAULT_ACCOUNT_EMAIL: '${DEFAULT_ACCOUNT_EMAIL}'
      DEFAULT_ACCOUNT_PASSWORD: '${DEFAULT_ACCOUNT_PASSWORD}'
      DEFAULT_ACCOUNT_NAME: '${DEFAULT_ACCOUNT_NAME:-}'
      SKILLS_REFRESH_ENABLED: '${SKILLS_REFRESH_ENABLED:-true}'
      SKILLS_GITHUB_TOKEN: '${SKILLS_GITHUB_TOKEN:-}'
      # Origins an `ollama` / `openai-compatible` LLM provider may call (comma-separated).
      LLM_ALLOWED_BASE_URLS: '${LLM_ALLOWED_BASE_URLS:-}'
      # Keys of the encrypter that seals every stored LLM secret (keys, subscriptions).
      LLM_KEYS_ENCRYPTION_KEYS: '${LLM_KEYS_ENCRYPTION_KEYS:-}'
      # Short-lived folders of the `claude` binary's launches (subscriptions are in the DB).
      CLAUDE_CODE_HOME: /data/claude
      FRONTEND_URL: '${SERVICE_URL_WEB}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_SSL: '${DB_SSL:-false}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SESSION_DRIVER: cookie
      SESSION_COOKIE_SAME_SITE: none
      SESSION_COOKIE_SECURE: 'true'
      LIMITER_STORE: memory
      SMTP_HOST: '${SMTP_HOST}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USERNAME: '${SMTP_USERNAME}'
      SMTP_PASSWORD: '${SMTP_PASSWORD}'
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'
      MAIL_FROM_NAME: Coreloom UML
      # Object storage (@adonisjs/drive). No MinIO in this stack — point at a
      # real S3 / R2 / Spaces bucket. See infra/.env.production.example.
      DRIVE_DISK: '${DRIVE_DISK:-s3}'
      S3_ENDPOINT: '${S3_ENDPOINT}'
      S3_REGION: '${S3_REGION:-auto}'
      S3_BUCKET: '${S3_BUCKET}'
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY}'
      S3_PUBLIC_URL: '${S3_PUBLIC_URL:-}'
      # Observability — a SigNoz instance dedicated to production (below), not
      # shared with staging: an incident on one never blinds the other.
      # E2B sandboxes, required: code maps from GitHub, the assistant's repository tools and
      # the web research all run there. The key alone is E2B Cloud; a self-hosted install
      # (e2b-dev/runtime, Embed) adds its two URLs.
      E2B_API_KEY: '${E2B_API_KEY:?set E2B_API_KEY (E2B Cloud, or a self-hosted install with E2B_API_URL and E2B_SANDBOX_URL)}'
      E2B_API_URL: '${E2B_API_URL:-}'
      E2B_SANDBOX_URL: '${E2B_SANDBOX_URL:-}'
      # The API's public address: the GitHub App's webhook URL when it is created from the settings.
      API_URL: '${SERVICE_URL_API}'
      # GitHub App (private repositories, push webhook): all six or none, or leave them empty and
      # create the App from the settings; see the README.
      GITHUB_APP_ID: '${GITHUB_APP_ID:-}'
      GITHUB_APP_SLUG: '${GITHUB_APP_SLUG:-}'
      GITHUB_APP_CLIENT_ID: '${GITHUB_APP_CLIENT_ID:-}'
      GITHUB_APP_CLIENT_SECRET: '${GITHUB_APP_CLIENT_SECRET:-}'
      GITHUB_APP_PRIVATE_KEY: '${GITHUB_APP_PRIVATE_KEY:-}'
      GITHUB_APP_WEBHOOK_SECRET: '${GITHUB_APP_WEBHOOK_SECRET:-}'
      OTEL_SERVICE_NAME: coreloom-uml-api-production
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://signoz-otel-collector:4318'
    # The short-lived folders of the `claude` binary's launches live in memory, so a launch cut off
    # by a crash leaves nothing on a disk (uid 1000 is the image's `node`).
    tmpfs:
      - /data/claude:mode=0700,uid=1000,gid=1000
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider http://127.0.0.1:3333/health || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # BullMQ job worker — same image as `api`, run as an extra process (like
  # `migrate`). Processes jobs dispatched onto the queue.
  queue-worker:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-api:${IMAGE_TAG:-production-latest}'
    pull_policy: always
    restart: unless-stopped
    command:
      - node
      - '--import'
      - './instrumentation.js'
      - 'bin/console.js'
      - 'queue:work'
      # Every queue but `skill-scans`, `skill-topics` and `convention-evals`, which only the
      # skill-scanner, the skill-tagger and the convention-evals worker below can run.
      - '--queues=default'
      - '--queues=code-maps'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_NAME: coreloom-uml-worker-production
      LOG_LEVEL: info
      APP_KEY: '${SERVICE_PASSWORD_64_APPKEY}'
      DEFAULT_ACCOUNT_EMAIL: '${DEFAULT_ACCOUNT_EMAIL}'
      DEFAULT_ACCOUNT_PASSWORD: '${DEFAULT_ACCOUNT_PASSWORD}'
      DEFAULT_ACCOUNT_NAME: '${DEFAULT_ACCOUNT_NAME:-}'
      SKILLS_REFRESH_ENABLED: '${SKILLS_REFRESH_ENABLED:-true}'
      SKILLS_GITHUB_TOKEN: '${SKILLS_GITHUB_TOKEN:-}'
      FRONTEND_URL: '${SERVICE_URL_WEB}'
      # Keys of the encrypter that seals every stored LLM secret (keys, subscriptions).
      LLM_KEYS_ENCRYPTION_KEYS: '${LLM_KEYS_ENCRYPTION_KEYS:-}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_SSL: '${DB_SSL:-false}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SMTP_HOST: '${SMTP_HOST}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USERNAME: '${SMTP_USERNAME}'
      SMTP_PASSWORD: '${SMTP_PASSWORD}'
      MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS}'
      MAIL_FROM_NAME: Coreloom UML
      DRIVE_DISK: '${DRIVE_DISK:-s3}'
      S3_ENDPOINT: '${S3_ENDPOINT}'
      S3_REGION: '${S3_REGION:-auto}'
      S3_BUCKET: '${S3_BUCKET}'
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY}'
      S3_PUBLIC_URL: '${S3_PUBLIC_URL:-}'
      # E2B sandboxes, required: code maps from GitHub, the assistant's repository tools and
      # the web research all run there. The key alone is E2B Cloud; a self-hosted install
      # (e2b-dev/runtime, Embed) adds its two URLs.
      E2B_API_KEY: '${E2B_API_KEY:?set E2B_API_KEY (E2B Cloud, or a self-hosted install with E2B_API_URL and E2B_SANDBOX_URL)}'
      E2B_API_URL: '${E2B_API_URL:-}'
      E2B_SANDBOX_URL: '${E2B_SANDBOX_URL:-}'
      # GitHub App (private repositories, push webhook): all six or none; see the README.
      GITHUB_APP_ID: '${GITHUB_APP_ID:-}'
      GITHUB_APP_SLUG: '${GITHUB_APP_SLUG:-}'
      GITHUB_APP_CLIENT_ID: '${GITHUB_APP_CLIENT_ID:-}'
      GITHUB_APP_CLIENT_SECRET: '${GITHUB_APP_CLIENT_SECRET:-}'
      GITHUB_APP_PRIVATE_KEY: '${GITHUB_APP_PRIVATE_KEY:-}'
      GITHUB_APP_WEBHOOK_SECRET: '${GITHUB_APP_WEBHOOK_SECRET:-}'
      OTEL_SERVICE_NAME: coreloom-uml-worker-production
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://signoz-otel-collector:4318'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Skill scanner — the API's worker in its own image (stage `skill-scanner` of
  # apps/api/Dockerfile: the API plus NVIDIA's SkillSpector, pinned), listening
  # to the `skill-scans` queue only. It reads each copy of a skill from Drive,
  # scans it (static analysis, no model) and writes the verdict on its row. Its
  # own APP_KEY, and none of the GitHub, E2B, account or mail settings it never
  # uses. See infra/skill-scanner/README.md.
  skill-scanner:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-skill-scanner:${IMAGE_TAG:-production-latest}'
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_NAME: coreloom-uml-skill-scanner-production
      LOG_LEVEL: info
      APP_KEY: '${SERVICE_PASSWORD_64_SKILLSCANNERKEY}'
      FRONTEND_URL: '${SERVICE_URL_WEB}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_SSL: '${DB_SSL:-false}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Required by the API's settings, never used by a scan.
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      MAIL_FROM_ADDRESS: no-reply@localhost
      DRIVE_DISK: '${DRIVE_DISK:-s3}'
      S3_ENDPOINT: '${S3_ENDPOINT}'
      S3_REGION: '${S3_REGION:-auto}'
      S3_BUCKET: '${S3_BUCKET}'
      S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID}'
      S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY}'
      S3_PUBLIC_URL: '${S3_PUBLIC_URL:-}'
      OTEL_SERVICE_NAME: coreloom-uml-skill-scanner-production
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://signoz-otel-collector:4318'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Skill tagger — the API's worker in its own image (stage `skill-tagger` of
  # apps/api/Dockerfile: Debian, since the embedding model's runtime needs glibc),
  # listening to the `skill-topics` queue only. It reads each new or changed
  # skill with an embedding model pinned by commit (about 600 MB, downloaded once
  # into skill-tagger-models) and tags the catalog from the labels; about 1.5 GB
  # of memory while it reads. Its own APP_KEY, and none of the GitHub, E2B, Drive,
  # account or mail settings it never uses. See infra/skill-tagger/README.md.
  skill-tagger:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-skill-tagger:${IMAGE_TAG:-production-latest}'
    restart: unless-stopped
    # A first run in fp32 peaks at 4.8 GB (infra/skill-tagger/README.md): a guard against a leak.
    mem_limit: 6g
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_NAME: coreloom-uml-skill-tagger-production
      LOG_LEVEL: info
      APP_KEY: '${SERVICE_PASSWORD_64_SKILLTAGGERKEY}'
      FRONTEND_URL: '${SERVICE_URL_WEB}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_SSL: '${DB_SSL:-false}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Required by the API's settings, never used by the tagger.
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      MAIL_FROM_ADDRESS: no-reply@localhost
      SKILL_TAGGER_CACHE: /models
      OTEL_SERVICE_NAME: coreloom-uml-skill-tagger-production
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://signoz-otel-collector:4318'
    volumes:
      - 'skill-tagger-models:/models'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Convention evals worker — the API's worker in its own image (stage
  # `convention-evals` of apps/api/Dockerfile: Debian, Harbor with its E2B extra
  # from a hash-locked lock, our Harbor classes, Claude Code), listening to the
  # `convention-evals` queue only. It runs `harbor run -e e2b` for a run of an
  # account's conventions: each trial in an E2B sandbox, with the account's
  # saved key or subscription, which it resolves itself (hence the LLM keys'
  # encrypter). Its own APP_KEY, and none of the GitHub, Drive or mail settings
  # it never uses. A run's folder (/runs) is a tmpfs and the container may not
  # swap (memswap_limit equal to mem_limit), since a key sits in Harbor's
  # process while it runs: the host must not give the container swap another
  # way either. See infra/evals/README.md.
  convention-evals:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-convention-evals:${IMAGE_TAG:-production-latest}'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_NAME: coreloom-uml-convention-evals-production
      LOG_LEVEL: info
      APP_KEY: '${SERVICE_PASSWORD_64_CONVENTIONEVALSKEY}'
      FRONTEND_URL: '${SERVICE_URL_WEB}'
      LLM_KEYS_ENCRYPTION_KEYS: '${LLM_KEYS_ENCRYPTION_KEYS:-}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-5432}'
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_SSL: '${DB_SSL:-false}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Required by the API's settings, never used by the worker.
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      MAIL_FROM_ADDRESS: no-reply@localhost
      E2B_API_KEY: '${E2B_API_KEY:?set E2B_API_KEY (E2B Cloud, or a self-hosted install with E2B_API_URL and E2B_SANDBOX_URL)}'
      E2B_API_URL: '${E2B_API_URL:-}'
      E2B_SANDBOX_URL: '${E2B_SANDBOX_URL:-}'
      CONVENTION_EVALS_DIR: /runs
      CLAUDE_CODE_HOME: /data/claude
      OTEL_SERVICE_NAME: coreloom-uml-convention-evals-production
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://signoz-otel-collector:4318'
    # No core dump of Harbor or Claude Code (they hold a key) lands on a disk.
    ulimits:
      core: 0
    tmpfs:
      - /runs:mode=0700,uid=1000,gid=1000,size=1g,noexec,nosuid,nodev
      - /data/claude:mode=0700,uid=1000,gid=1000,size=64m,nosuid,nodev
    mem_limit: 4g
    memswap_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  redis:
    image: 'redis:7.4.11-alpine'
    restart: unless-stopped
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  # bull-board — queue dashboard (inspect / retry / remove jobs). Published on
  # its own subdomain by Coolify; drop this service if tunnel-only access is
  # preferred. Basic auth is mandatory — set BULLBOARD_USER / BULLBOARD_PASSWORD.
  bull-board:
    image: 'venatum/bull-board:3.4.11'
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      SERVICE_FQDN_BULLBOARD_3000: '${SERVICE_FQDN_BULLBOARD_3000:-}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      BULL_PREFIX: bull
      BULL_VERSION: BULLMQ
      USER_LOGIN: '${BULLBOARD_USER}'
      USER_PASSWORD: '${BULLBOARD_PASSWORD}'
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: 'ghcr.io/${IMAGE_OWNER}/coreloom-uml-web:${IMAGE_TAG:-production-latest}'
    pull_policy: always
    restart: unless-stopped
    expose:
      - '80'
    environment:
      # Injected into the SPA at container start (docker/30-render-env-js.sh) —
      # a domain change no longer needs an image rebuild, only a restart.
      API_URL: '${SERVICE_URL_API}'
    depends_on:
      - api
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider http://127.0.0.1:80/ || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # SigNoz — dedicated to production, NOT shared with staging (see the design
  # spec). Identical to the block in infra/docker-compose.staging.yml — on any
  # upstream re-copy of infra/signoz/*, copy this block from staging's file
  # too, per AGENTS.md's vendoring note. Same topology: ClickHouse + ZooKeeper
  # + a one-shot init + a schema migrator + the SigNoz app (UI/API on 8080) +
  # the SigNoz OTel collector (OTLP on 4317/4318 — what `api`/`queue-worker`
  # export to). Only `signoz` gets a domain.
  # ---------------------------------------------------------------------------
  signoz-init-clickhouse:
    image: 'clickhouse/clickhouse-server:25.5.6'
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - 'signoz-clickhouse-user-scripts:/var/lib/clickhouse/user_scripts'

  signoz-zookeeper:
    image: 'signoz/zookeeper:3.7.1'
    restart: unless-stopped
    user: root
    environment:
      ZOO_SERVER_ID: '1'
      ALLOW_ANONYMOUS_LOGIN: 'yes'
      ZOO_AUTOPURGE_INTERVAL: '1'
      ZOO_ENABLE_PROMETHEUS_METRICS: 'yes'
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: '9141'
    volumes:
      - 'signoz-zookeeper:/bitnami/zookeeper'
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null'
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-clickhouse:
    build:
      # The vendored SigNoz config is baked into the image rather than
      # bind-mounted: Coolify's Compose runner does not resolve relative host
      # bind-mount paths reliably. Context is the repo root — Coolify runs
      # `docker compose` with `--project-directory` set there regardless of
      # where this file lives; for a manual build pass `--project-directory ..`.
      context: .
      dockerfile: infra/signoz/clickhouse/Dockerfile
    restart: unless-stopped
    tty: true
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - 'signoz-clickhouse-user-scripts:/var/lib/clickhouse/user_scripts'
      - 'signoz-clickhouse:/var/lib/clickhouse'
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - '0.0.0.0:8123/ping'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy

  signoz-schema-migrator:
    image: 'signoz/signoz-otel-collector:v0.144.5'
    restart: on-failure
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: 'tcp://signoz-clickhouse:9000'
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: 'true'
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    depends_on:
      signoz-clickhouse:
        condition: service_healthy

  signoz:
    image: 'signoz/signoz:v0.128.0'
    restart: unless-stopped
    expose:
      - '8080'
    environment:
      # Coolify: attach a domain to this service, routed to container port
      # 8080. `expose` alone is not enough — this SERVICE_FQDN_<svc>_<port>
      # marker tells Coolify which port to proxy. Set it in the resource's
      # Environment Variables editor to e.g.
      #   SERVICE_FQDN_SIGNOZ_8080=https://signoz.example.com
      SERVICE_FQDN_SIGNOZ_8080: '${SERVICE_FQDN_SIGNOZ_8080:-}'
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: 'tcp://signoz-clickhouse:9000'
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: '${SERVICE_PASSWORD_64_SIGNOZJWT}'
    volumes:
      - 'signoz-sqlite:/var/lib/signoz'
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - 'localhost:8080/api/v1/health'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      signoz-clickhouse:
        condition: service_healthy

  signoz-otel-collector:
    build:
      # Config baked into the image, not bind-mounted — see the note on the
      # signoz-clickhouse service. Context is the repo root.
      context: .
      dockerfile: infra/signoz/otel-collector/Dockerfile
    restart: unless-stopped
    # OTLP receivers — `api`/`queue-worker` export to signoz-otel-collector:4318.
    expose:
      - '4317'
      - '4318'
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: 'false'
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: 'tcp://signoz-clickhouse:9000'
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: 'true'
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-schema-migrator:
        condition: service_completed_successfully

volumes:
  # The Claude account folders from before `claude_code_states`, read once by `claude:import`
  # (service `migrate`). Can be removed once that has run.
  claude-config:
  redis-data:
  skill-tagger-models:
  signoz-clickhouse:
  signoz-clickhouse-user-scripts:
  signoz-zookeeper:
  signoz-sqlite:
