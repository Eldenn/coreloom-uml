name: coreloom-uml-dev

services:
  # -----------------------------------------------
  # PostgreSQL 16 — the only service an MVP needs locally.
  # -----------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coreloom_uml_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # Redis 7 — backs @adonisjs/redis and the BullMQ job queue
  # (@nemoventures/adonis-jobs). Run the worker with:
  #   pnpm --filter @coreloom-uml/api queue:work
  # -----------------------------------------------
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # bull-board — web UI to inspect / retry / promote / remove queue jobs
  # (dev only). Auto-discovers BullMQ queues under the `bull` prefix.
  # Web UI:  http://localhost:8082
  # -----------------------------------------------
  bull-board:
    image: venatum/bull-board:3.4.11
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_PREFIX: bull
      BULL_VERSION: BULLMQ
    ports:
      - "127.0.0.1:8082:3000"

  # -----------------------------------------------
  # Mailpit — local SMTP catch-all (dev only). Password reset and email
  # verification land here instead of a real inbox; nothing leaves the machine.
  # SMTP:    mailpit:1025 (as seen by the api container)
  # Web UI:  http://localhost:8025
  # -----------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.30.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # MinIO — local S3-compatible object storage for @adonisjs/drive (dev only).
  # Avatar uploads and other blobs land here instead of a real S3/R2 bucket;
  # nothing leaves the machine.
  # S3 API:  http://localhost:9000 (minio:9000 as seen by the api container)
  # Console: http://localhost:9001  (user/pass: minioadmin / minioadmin)
  # -----------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # minio-init — one-shot: creates the (private) app bucket, then exits.
  # Idempotent — safe to re-run: `docker compose ... run --rm minio-init`.
  # The bucket stays private; avatars are served via signed URLs / a proxy route.
  # -----------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-coreloom-uml}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

volumes:
  postgres_data:
  minio_data:
