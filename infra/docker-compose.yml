name: coreloom-uml-dev

services:
  # -----------------------------------------------
  # PostgreSQL 16 — the only service an MVP needs locally.
  # -----------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coreloom_uml_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # postgres-init — one-shot, on every `up`: creates the app's databases when
  # they're missing (dev + test), then exits. Unlike /docker-entrypoint-initdb.d,
  # it also works on a volume that already exists.
  # -----------------------------------------------
  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASES: coreloom_uml_dev coreloom_uml_test
    entrypoint:
      - /bin/sh
      - -c
      - >
        for db in $$DATABASES; do
          psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$db'" | grep -q 1 ||
          psql -c "CREATE DATABASE $$db" || exit 1;
        done
    restart: 'no'

  # -----------------------------------------------
  # Redis 7 — backs @adonisjs/redis and the BullMQ job queue
  # (@nemoventures/adonis-jobs). Run the worker with:
  #   pnpm --filter @coreloom-uml/api queue:work
  # -----------------------------------------------
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # bull-board — web UI to inspect / retry / promote / remove queue jobs
  # (dev only). Auto-discovers BullMQ queues under the `bull` prefix.
  # Web UI:  http://localhost:8082
  # -----------------------------------------------
  bull-board:
    image: venatum/bull-board:3.4.11
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_PREFIX: bull
      BULL_VERSION: BULLMQ
    ports:
      - "127.0.0.1:8082:3000"

  # -----------------------------------------------
  # Skill scanner — the API's worker in its own image (stage `skill-scanner`
  # of apps/api/Dockerfile: the API plus NVIDIA's SkillSpector, pinned), on the
  # `skill-scans` queue only. Heavy to build, so behind a profile:
  #   docker compose -f infra/docker-compose.yml --profile skills up -d skill-scanner
  # It reads apps/api/.env and reaches the other services by name. Without it,
  # the copies stay unscanned and cannot be approved. See
  # infra/skill-scanner/README.md.
  # -----------------------------------------------
  skill-scanner:
    profiles: ["skills"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: skill-scanner
    restart: unless-stopped
    env_file: ../apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: postgres
      # NODE_ENV=production turns TLS on, which the local Postgres does not speak.
      DB_SSL: 'false'
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------
  # Skill tagger — the API's worker on the `skill-topics` queue, in its own image
  # (Debian: the embedding model's runtime needs glibc). Its first run downloads
  # the model (2.4 GB) into skill_tagger_models. On a Linux or macOS host,
  # `pnpm --filter @coreloom-uml/api queue:tag` runs it without this service
  # (`node ace skills:classify` queues a run). See infra/skill-tagger/README.md.
  # -----------------------------------------------
  skill-tagger:
    profiles: ["skills"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: skill-tagger
    restart: unless-stopped
    # A first run in fp32 peaks at 4.8 GB (infra/skill-tagger/README.md): a guard against a leak.
    mem_limit: 6g
    env_file: ../apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: postgres
      # NODE_ENV=production turns TLS on, which the local Postgres does not speak.
      DB_SSL: 'false'
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SKILL_TAGGER_CACHE: /models
    volumes:
      - skill_tagger_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------
  # Convention evals worker — the API's worker on the `convention-evals` queue,
  # in its own image (stage `convention-evals` of apps/api/Dockerfile: Debian,
  # Harbor and its E2B extra from a hash-locked lock, our Harbor classes, Claude
  # Code). Each trial runs in a sandbox of the self-hosted E2B install
  # (infra/e2b/), which it reaches on the host: its URLs are the host's, seen
  # from the container. Behind a profile:
  #   docker compose -f infra/docker-compose.yml --env-file apps/api/.env \
  #     --profile evals up -d convention-evals
  # A run's folder is a tmpfs, and the container may not swap (memswap_limit
  # equal to mem_limit): a saved key may be in that folder while Harbor runs.
  # See infra/evals/README.md.
  # -----------------------------------------------
  convention-evals:
    profiles: ["evals"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: convention-evals
    restart: unless-stopped
    # Only what the worker needs (security review I6), read from the API's own settings when
    # Compose is started with them: `--env-file apps/api/.env`. No GitHub, Drive, mail or
    # default account secret.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3333'
      APP_NAME: coreloom-uml-convention-evals
      LOG_LEVEL: info
      APP_KEY: '${APP_KEY:?start with --env-file apps/api/.env}'
      FRONTEND_URL: '${FRONTEND_URL:-http://localhost:5173}'
      LLM_KEYS_ENCRYPTION_KEYS: '${LLM_KEYS_ENCRYPTION_KEYS:-}'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: '${DB_USER:?start with --env-file apps/api/.env}'
      DB_PASSWORD: '${DB_PASSWORD:?start with --env-file apps/api/.env}'
      DB_DATABASE: '${DB_DATABASE:?start with --env-file apps/api/.env}'
      # NODE_ENV=production turns TLS on, which the local Postgres does not speak.
      DB_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
      # Required by the API's settings, never used by the worker.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM_ADDRESS: no-reply@localhost
      E2B_API_KEY: '${E2B_API_KEY:?start with --env-file apps/api/.env}'
      E2B_API_URL: http://host.docker.internal:3000
      E2B_SANDBOX_URL: http://host.docker.internal:3002
      CONVENTION_EVALS_DIR: /runs
      CLAUDE_CODE_HOME: /data/claude
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No core dump of Harbor or Claude Code (they hold a key) lands on a disk (security S2).
    ulimits:
      core: 0
    tmpfs:
      - /runs:mode=0700,uid=1000,gid=1000,size=1g,noexec,nosuid,nodev
      - /data/claude:mode=0700,uid=1000,gid=1000,size=64m,nosuid,nodev
    mem_limit: 4g
    memswap_limit: 4g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------
  # Mailpit — local SMTP catch-all (dev only). Password reset and email
  # verification land here instead of a real inbox; nothing leaves the machine.
  # SMTP:    mailpit:1025 (as seen by the api container)
  # Web UI:  http://localhost:8025
  # -----------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.30.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # MinIO — local S3-compatible object storage for @adonisjs/drive (dev only).
  # Avatar uploads and other blobs land here instead of a real S3/R2 bucket;
  # nothing leaves the machine.
  # S3 API:  http://localhost:9000 (minio:9000 as seen by the api container)
  # Console: http://localhost:9001  (user/pass: minioadmin / minioadmin)
  # -----------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------
  # minio-init — one-shot: creates the (private) app bucket, then exits.
  # Idempotent — safe to re-run: `docker compose ... run --rm minio-init`.
  # The bucket stays private; avatars are served via signed URLs / a proxy route.
  # -----------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-coreloom-uml}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

volumes:
  postgres_data:
  minio_data:
  skill_tagger_models:
