packages:
  - "apps/*"
  - "packages/*"

publicHoistPattern:
  - "@adonisjs/*"
  - "@types/*"

allowBuilds:
  '@swc/core': true
  msgpackr-extract: true
  esbuild: true
  '@tailwindcss/oxide': true
  # protobufjs' only install script is a no-op version-scheme warning check.
  protobufjs: false
  # The CPU build the skill tagger runs is in the package; its install script only downloads
  # the CUDA and other accelerator builds, which nothing here uses.
  onnxruntime-node: false

# The API is built on Alpine (musl), and its `skill-tagger` image runs that build on Debian (glibc),
# which onnxruntime needs: install the glibc builds of native packages (sharp, for transformers.js)
# beside those of the machine's own libc.
supportedArchitectures:
  libc:
    - current
    - glibc

minimumReleaseAgeExclude:
  - '@tanstack/history@1.162.4'
  - '@tanstack/react-router@1.170.36'
  - '@tanstack/router-core@1.171.30'
  - '@tanstack/router-generator@1.167.36'
  - '@tanstack/router-plugin@1.168.38'

# coreloom-ui pins @codemirror/view; some @codemirror/* packages ask for a newer patch, which
# would load two copies and break CodeEditor's types. One copy, the pinned one.
overrides:
  '@codemirror/view': 6.43.14
