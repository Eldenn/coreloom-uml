name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coreloom_uml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: localhost
      PORT: 3333
      APP_KEY: ci-test-app-key-please-change-me-0000000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: coreloom_uml_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SESSION_DRIVER: memory
      LIMITER_STORE: memory
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@coreloom-uml.dev
      # No MinIO service in CI — the filesystem disk needs no S3 config.
      DRIVE_DISK: fs
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse committed coding-agent files
        run: node scripts/check-agent-files.mjs

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm --filter @coreloom-uml/api migration:run

      # The API's tests run the command line that maps a clone in a sandbox with the graphify
      # version the sandbox template pins (GRAPHIFY_TESTED_VERSION), so a graphify change shows
      # here first.
      - name: Install graphify for the code map tests
        run: pipx install graphifyy==0.9.108

      - run: pnpm test

      # Not dependencies of the workspace: only this job needs them. Exact versions; Claude Code's
      # is the one the API image pins.
      - name: Install the coding tools the generated files are written for
        run: npm install --global @openai/codex@0.167.2 @anthropic-ai/claude-code@2.1.322

      # No test signs in or calls a model. A missing tool fails here instead of being skipped.
      - name: Load the generated agent files into the tools they target
        run: pnpm --filter @coreloom-uml/catalog test:e2e

      - run: pnpm build

      - name: Validate production compose file
        # The file refuses to load without E2B_API_KEY: a placeholder is enough to check it.
        env:
          E2B_API_KEY: ci-placeholder
        run: docker compose -f infra/docker-compose.production.yml config --quiet

  # Our Harbor classes (infra/evals/coreloom_harbor): their tests are the only offline proof that
  # the key reaches the agent's command through a file only (never a command line, an env or a
  # standard input), that the agent's user cannot become root and that each phase's
  # network is read back. Built from the worker's own `harbor` stage (Harbor from its hash-locked
  # lock, no API build, no Claude Code), run as `node`. About 45 s (31 s build, 12 s tests).
  harbor-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Harbor and our classes, as the worker installs them
        run: docker build --file apps/api/Dockerfile --target harbor --tag coreloom-harbor-tests .

      - name: Run the classes' tests as node
        run: >-
          docker run --rm --volume "$PWD/infra/evals:/src:ro" --workdir /src
          --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /opt/harbor/bin/python
          coreloom-harbor-tests -m unittest discover -s coreloom_harbor/tests -t .
