name: Require changeset

# Fails a pull request that doesn't add a changeset file. See
# .changeset/README.md — every PR runs `pnpm changeset` and commits the
# result; a PR with no user-facing effect (docs, CI, internal refactors)
# uses `pnpm changeset add --empty` instead of skipping this check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  require-changeset:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for an added changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --quiet
          added="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md')"
          if [ -z "${added}" ]; then
            echo "::error::No changeset added. Run 'pnpm changeset' (or 'pnpm changeset add --empty' for a change with no user-facing effect) and commit the result — see .changeset/README.md."
            exit 1
          fi
          echo "Changeset(s) found:"
          echo "${added}"
